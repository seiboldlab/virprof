userdata:
  virprof:
    # Version number for reports.
    # Adjust if you make modifications to the pipeline.
    version: 0.9.0

include:
  - pipelines.yml   # pipeline definitions
  - references.yml  # custom references
  - config.yml      # default configuration parameters
  - overrides.yml   # job size overrides

directories:
  rules:
    virprof:
      rules # Add VirProf custom rules

conda:
  env_specs:
    - conda_envs # use VirProf env-specs

