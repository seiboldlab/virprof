# Specific settings for each rule in VirProf, overriding YMP default
# values as tested on our cluster. 
overrides:
  rules:
    # RNA-Seq pipeline adjustments
    vp_tximport_salmon:
      resources:
        mem: 256G  # enough for 10k samples
      threads: 48
    bbmap_trim:
      resources:
        mem: 32G
        nfs_mbps: 20
        walltime: 04:00:00
      threads: 8
    multiqc_report:
      resources:
        nfs_mbps: 5
        walltime: 02:00:00
        mem: 40g
